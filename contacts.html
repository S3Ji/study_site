    <link href="css/style.css" rel="stylesheet">
</head>

    <nav class="navbar navbar-expand-lg navbar-dark site-nav">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">
                <i class="bi bi-shield-check"></i>
                SecAudit
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Главная</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">Об анализе</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="methodology.html">Методология</a>

                    <li class="nav-item">

    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Контакты</h1>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="row g-5 align-items-center">

                    <div class="col-lg-5">
                        <img src="images/contacts-security.png"
                             class="contact-image"
                             alt="Контактная информация">
                    </div>

                    <div class="col-lg-7">
                        <form class="card p-4" id="contactForm">

                            <div class="mb-3">
                                <label class="form-label" for="name">
                                    Имя
                                </label>

                                <input class="form-control"
                                       id="name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">
                                    Email
                                </label>

                                <input class="form-control"
                                       id="email"
                                       type="email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="subject">
                                    Тема обращения
                                </label>

                                <input class="form-control"
                                       id="subject"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="message">
                                    Сообщение
                                </label>

                                <textarea class="form-control"
                                          id="message"
                                          rows="5"
                                          required></textarea>
                            </div>

                            <button class="btn btn-primary align-self-start"
                                    type="submit">
                                Отправить
                            </button>

                            <div class="alert alert-success d-none mt-3 mb-0"
                                 id="notice">
                                Демонстрационная форма: сообщение не отправляется на сервер.
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer class="footer py-4">
        <div class="container">
